# Redocly lint ruleset for the CFG Tickets API.
# Starts from `minimal` and tunes the rules that don't apply to this service:
#  - security-defined: the API is unauthenticated for the assessment scope.
#  - operationId-*: not required for an internally-consumed contract.
#  - no-unused-components: shared error responses are intentionally reusable.
extends:
  - minimal

rules:
  security-defined: off
  operation-operationId: off
  operation-operationId-unique: warn
  operation-2xx-response: warn
  operation-4xx-response: off
  no-unused-components: off
  no-empty-servers: off
  info-license: off
  tag-description: off
  no-ambiguous-paths: error
  no-identical-paths: error
