services:
  db:
    image: postgres:16-alpine
    container_name: cfg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    networks: [cfgnet]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: cfg-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "${API_PORT:-3000}:3000"
    networks: [cfgnet]

volumes:
  pgdata:

networks:
  cfgnet:
    driver: bridge
